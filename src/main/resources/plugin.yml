# Quest metrics, without touching the database.
#
# BetonQuest keeps its state in MySQL, but it also emits real Bukkit events:
# PlayerTagAddEvent, PlayerUpdatePointEvent, PlayerJournalAddEvent. We listen
# instead of querying, which avoids coupling this exporter to a schema it
# doesn't own, and keeps TPS independent of a database.
name: VaniaMetrics-BetonQuest
version: ${version}
main: fr.samflix.vaniametrics.module.betonquest.BetonQuestPaper
api-version: '1.21'
authors: [mc-vania]
description: "BetonQuest metrics: tags, points, journal, conversations."
depend: [VaniaMetrics, BetonQuest]
